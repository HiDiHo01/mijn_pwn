# Home Assistant-aligned Ruff formatting and import ordering.
target-version = "py314"
line-length = 88
required-version = ">=0.17.3"

[lint]
# Enforce Python errors, undefined names, unused imports, and HA-style isort.
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false
known-first-party = ["homeassistant", "custom_components"]

[format]
# Home Assistant uses LF line endings; avoid CRLF-only diff noise on Windows.
line-ending = "lf"
