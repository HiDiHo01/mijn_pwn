name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install image validators
        run: python -m pip install Pillow==12.3.0 defusedxml==0.7.1

      - name: Validate PNG and SVG images
        run: python scripts/validate_images.py
