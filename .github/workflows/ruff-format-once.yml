# Temporary branch-specific formatting pass; remove after the initial migration.
name: Apply Ruff formatting once

on:
  push:
    branches:
      - chore/sync-ai-review-rules-2026-11-06

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'HiDiHo01/mijn_pwn'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install formatter
        run: python -m pip install ruff==0.17.3

      - name: Apply Ruff import ordering and formatting
        run: |
          ruff check --select I --fix .
          ruff format .
          git diff --check

      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.py'
            git commit -m "style: format Python sources with Ruff"
            git push origin HEAD:chore/sync-ai-review-rules-2026-11-06
          fi
