name: SonarCloud issue triage (PR 9)

on:
  pull_request:
    paths:
      - ".github/workflows/sonarcloud-triage.yml"
      - "scripts/sonarcloud_triage.py"
      - "scripts/test_sonarcloud_triage.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview only or mark 3 audited PR #9 issues false-positive"
        required: true
        type: choice
        default: preview
        options:
          - preview
          - mark_false_positive
      confirmation:
        description: "For write mode, enter MARK_PR9_FALSE_POSITIVES"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sonarcloud-triage-pr9
  cancel-in-progress: false

jobs:
  tests:
    name: SonarCloud triage unit tests (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Run offline regression tests
        run: python -m unittest -v scripts.test_sonarcloud_triage

  triage:
    name: Authorized SonarCloud classification
    needs: tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'HiDiHo01/mijn_pwn'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: sonarcloud-triage
    steps:
      - name: Check out reviewed default-branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Validate secret and perform selected triage
        env:
          SONARCLOUD_TRIAGE_TOKEN: ${{ secrets.SONARCLOUD_TRIAGE_TOKEN }}
          SONARCLOUD_TRIAGE_MODE: ${{ inputs.mode }}
          SONARCLOUD_TRIAGE_CONFIRMATION: ${{ inputs.confirmation }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/sonarcloud_triage.py
