name: Lint and Format

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.17.3

      - name: Check formatting (Home Assistant Ruff)
        run: ruff format --check .

      - name: Lint and check import order
        run: ruff check --output-format=github .
