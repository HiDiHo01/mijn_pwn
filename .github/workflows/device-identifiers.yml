name: Device Identifier Migration Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  device-identifiers:
    name: Registry migration tests (Home Assistant)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Run tests in Home Assistant 2026.11.0
        run: |
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python3 \
            ghcr.io/home-assistant/home-assistant:2026.11.0@sha256:c6c1ca9931036bf3a2c4cc088d8db25dfea3b33935a5ecc83c40349462e2f69e \
            -m unittest -v \
            custom_components.mijn_pwn.test_device_identifiers \
            custom_components.mijn_pwn.test_naming_translations \
            custom_components.mijn_pwn.test_data_parsers \
            custom_components.mijn_pwn.test_sensor_expansion \
            custom_components.mijn_pwn.test_reading_request \
            custom_components.mijn_pwn.test_reading_request_entities \
            custom_components.mijn_pwn.test_move_house_endpoint \
            custom_components.mijn_pwn.test_private_confirmation \
            custom_components.mijn_pwn.test_water_meter_details \
            custom_components.mijn_pwn.test_measurement_validation \
            custom_components.mijn_pwn.test_closed_reading_request \
            custom_components.mijn_pwn.test_reading_draft_number \
            custom_components.mijn_pwn.test_confirmed_reading \
            custom_components.mijn_pwn.test_plausible_reading \
            custom_components.mijn_pwn.test_final_submission \
            custom_components.mijn_pwn.test_submit_workflow \
            custom_components.mijn_pwn.test_review_fixes \
            custom_components.mijn_pwn.test_config_flow \
            custom_components.mijn_pwn.test_auth_recovery
